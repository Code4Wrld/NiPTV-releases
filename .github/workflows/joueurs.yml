# Photos des joueurs (bustes) des pages Sports : refaites après chaque mercato.
# Le mercato ferme vers le 1er septembre et le 2 février ; FootyLogos met ses photos à jour
# dans les jours qui suivent, d'où un second passage deux semaines plus tard.
name: Photos des joueurs

on:
  schedule:
    - cron: "0 5 3 9 *"
    - cron: "0 5 17 9 *"
    - cron: "0 5 3 2 *"
    - cron: "0 5 17 2 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Index par championnat
        run: python tools/joueurs/index.py data/joueurs
      - name: Publier s'il a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/joueurs
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "joueurs : photos en buste mises à jour"
          git push
